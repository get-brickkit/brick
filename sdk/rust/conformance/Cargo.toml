[package]
name = "conformance"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
brickkit = { path = "../brick" }
schemars = { version = "1.2.3", features = ["preserve_order"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
