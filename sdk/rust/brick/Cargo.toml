[package]
name = "brickkit"
# Released in lockstep with the @brickkit npm packages (scripts/release.ts).
version = "0.12.0"
edition = "2024"
rust-version = "1.88"
description = "Experimental: write Brick services in Rust, next to a Brick (TypeScript on Bun) app."
license = "MIT"
repository = "https://github.com/get-brickkit/brick"
homepage = "https://github.com/get-brickkit/brick"
documentation = "https://docs.rs/brickkit"
readme = "README.md"
keywords = ["brick", "brickkit", "microservices", "axum", "rpc"]
categories = ["web-programming::http-server"]

[dependencies]
axum = { version = "0.8.9", default-features = false, features = [
  "http1",
  "json",
  "tokio",
] }
base64 = "0.23.1"
jsonschema = { version = "0.60.2", default-features = false }
# rust_crypto pulls in p256/p384 -> elliptic-curve 0.13 -> crypto-bigint 0.5.5
# (RUSTSEC-2026-0387, non-constant-time ops; fixed only in 0.7). Not reachable
# with a secret here: the SDK only verifies signatures with public JWKS keys.
# Upgrade when jsonwebtoken (11.1.0 is the latest) moves to elliptic-curve 0.14.
jsonwebtoken = { version = "11", default-features = false, features = [
  "rust_crypto",
] }
# rustls: BRICK_JWKS_URL may be https, verified against the system's roots.
reqwest = { version = "0.13.5", default-features = false, features = [
  "json",
  "rustls",
] }
schemars = { version = "1.2.3", features = ["preserve_order"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread"] }

[dev-dependencies]
ed25519-dalek = { version = "2", features = ["pkcs8"] }
tower = { version = "0.5", features = ["util"] }
