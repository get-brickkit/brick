[package]
name = "brick"
version = "0.1.0"
edition = "2024"
description = "Write Brick services in Rust: actions served behind the Bun gateway."
license = "MIT"
publish = false

[dependencies]
axum = { version = "0.8.9", default-features = false, features = [
  "http1",
  "json",
  "tokio",
] }
base64 = "0.23.1"
jsonschema = { version = "0.60.2", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
schemars = { version = "1.2.3", features = ["preserve_order"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
