# Lint, typecheck, build and test every package and the docs site.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUN_VERSION: 1.4.4

jobs:
  packages:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: brick
          POSTGRES_PASSWORD: brick
          POSTGRES_DB: brick_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U brick" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      # Without it the Postgres outbox and CRUD transaction tests skip. The Redis
      # socket broker tests use the redis service on its default localhost:6379.
      # REDIS_TEST_URL stays unset: both worlds' storage tests use the key prefix
      # "workflow:test:" and run at once, so each file keeps its own testcontainer.
      TEST_DATABASE_URL: postgres://brick:brick@localhost:5432/brick_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # Go and Rust for the cross-language conformance test (sdk/conformance), which
      # `bun run test` runs. Under CI it fails instead of skipping without them.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: sdk/go/go.mod
          cache-dependency-path: |
            sdk/go/go.sum
            examples/pages/services/bench-go/go.sum
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: sdk/rust
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run format:check
      - run: bun run build
      - run: bun run build:worlds
      - run: bun run typecheck
      - run: bun run typecheck:worlds
      # REDIS_URL turns on examples/events' workflow tests (a Redis world). The
      # test script runs them from the example's folder: the Workflow SDK
      # resolves from the working directory, and their workflow transform would
      # leak into other test files.
      - run: bun run test
        env:
          REDIS_URL: redis://localhost:6379/9
      - run: bun run test:worlds

  # The Go and Rust SDKs on their own: vet, lint and unit tests.
  sdks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: sdk/go/go.mod
          cache-dependency-path: |
            sdk/go/go.sum
            examples/pages/services/bench-go/go.sum
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: sdk/rust
      - run: go vet ./...
        working-directory: sdk/go
      - run: go test ./...
        working-directory: sdk/go
      - run: cargo fmt --check
        working-directory: sdk/rust
      - run: cargo clippy --all-targets --locked -- -D warnings
        working-directory: sdk/rust
      - run: cargo test --locked
        working-directory: sdk/rust

  www:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      # The docs generate example architecture from the built @brickkit/core.
      - run: bun run build
      - run: bun run lint
        working-directory: www
      - run: bun run types:check
        working-directory: www
      - name: Test docs
        run: bun run docs:check
        working-directory: www
