# Lint, typecheck, build and test every package and the docs site.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  packages:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: brick
          POSTGRES_PASSWORD: brick
          POSTGRES_DB: brick_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U brick" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      # Without it every *.postgres.test.ts suite (and the other Postgres-gated
      # tests) skips. REDIS_TEST_URL stays unset, so the world tests start their
      # own Redis testcontainer instead of sharing the redis service.
      TEST_DATABASE_URL: postgres://brick:brick@localhost:5432/brick_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      # REDIS_URL turns on examples/events' workflow tests (a Redis world) and
      # points core's Redis socket broker tests at the redis service. The
      # test script runs them from the example's folder: the Workflow SDK
      # resolves from the working directory, and their workflow transform would
      # leak into other test files.
      - run: bun run check
        env:
          REDIS_URL: redis://localhost:6379/9
      - run: bun run test:worlds

  www:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      # Builds the packages first: the docs generate example architecture from
      # the built @brickkit/core.
      - run: bun run check:www

  # The worlds' e2e and chaos suites start their own redis-server; too slow for every PR.
  e2e:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: sudo apt-get update && sudo apt-get install -y redis-server
      - run: bun install --frozen-lockfile
      - run: bun run build:worlds && bun run test:e2e
