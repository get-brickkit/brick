# Stage a candidate, validate every package, then publish checked tarballs and commit.
# Only a fully successful publish creates a release commit and tag.
name: Publish to npm

on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - "packages/**"
      - "scripts/release*"
      - "sdk/rust/brick/Cargo.toml"
      - ".github/workflows/publish-npm.yml"
  workflow_dispatch:
    inputs:
      bump:
        description: "Stable version bump (beta branch automatically uses next beta)"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
          - beta
      dry_run:
        description: "Validate and pack the candidate without committing or publishing"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pack-pr-{0}', github.event.pull_request.number) || 'brick-release' }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.target.outputs.sha }}
      tag: ${{ steps.target.outputs.tag }}
    steps:
      - name: Require a release branch for manual releases
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" && "$GITHUB_REF" != "refs/heads/beta" ]]; then
            echo "::error::Run manual releases from main or beta"
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          # Freeze the dispatch SHA; a later branch edit must not enter this release.
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Test release tooling
        run: bun test scripts
      # Fail before anything is published, not halfway through the release.
      - name: Require the crates.io token for the Rust SDK
        if: github.event_name != 'pull_request' && inputs.dry_run != true
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [[ -z "$CARGO_REGISTRY_TOKEN" ]]; then
            echo "::error::The CARGO_REGISTRY_TOKEN secret is not set: add a crates.io token that can publish the brickkit crate (see CONTRIBUTING.md)"
            exit 1
          fi
      - name: Stage candidate versions without committing
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_BUMP: ${{ inputs.bump }}
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: |
          git switch -C "$RELEASE_BRANCH"
          if [[ "$RELEASE_BRANCH" == "beta" ]]; then RELEASE_BUMP=beta; fi
          bun run release "$RELEASE_BUMP" --prepare
      - name: Resolve candidate
        id: target
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          version="$(node -p "require('./packages/core/package.json').version")"
          tag="v${version}"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          crate="$(sed -n 's/^version = "\(.*\)"$/\1/p' sdk/rust/brick/Cargo.toml | head -n 1)"
          if [[ "$crate" != "$version" ]]; then
            echo "::error::sdk/rust/brick/Cargo.toml has version $crate, not $version"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: release-manifests
          path: |
            packages/core/package.json
            packages/crud/package.json
            packages/cli/package.json
            packages/bullmq-world/package.json
            packages/redis-world/package.json
            bun.lock
            sdk/rust/brick/Cargo.toml
            sdk/rust/Cargo.lock
            examples/pages/services/bench-rust/Cargo.lock
          if-no-files-found: error

  validate:
    needs: prepare
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        pkg: [core, crud, cli, bullmq-world, redis-world]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/download-artifact@v8
        with:
          name: release-manifests
          path: .
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Check synchronized package versions
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          for pkg in core crud cli bullmq-world redis-world; do
            version="$(node -p "require('./packages/$pkg/package.json').version")"
            if [[ "v$version" != "$RELEASE_TAG" ]]; then
              echo "::error::$pkg version does not match $RELEASE_TAG"
              exit 1
            fi
          done
      - name: Build packages and their workspace dependencies
        run: bun run build
      - name: Build world packages
        run: bun run build:worlds
      - name: Typecheck package
        run: bun run --filter @brickkit/${{ matrix.pkg }} typecheck
      - name: Test package
        if: ${{ !endsWith(matrix.pkg, '-world') }}
        run: bun test packages/${{ matrix.pkg }}
      # Worlds use vitest (with Redis testcontainers), which bun test cannot run.
      - name: Test world package
        if: ${{ endsWith(matrix.pkg, '-world') }}
        run: bun run --filter @brickkit/${{ matrix.pkg }} test
      - name: Pack the validated package
        working-directory: packages/${{ matrix.pkg }}
        run: |
          mkdir -p "$RUNNER_TEMP/package"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/package"
      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.pkg }}
          path: ${{ runner.temp }}/package/*.tgz
          if-no-files-found: error

  publish:
    needs: [prepare, validate]
    if: github.event_name != 'pull_request' && inputs.dry_run != true
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        pkg: [core, crud, cli, bullmq-world, redis-world]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/download-artifact@v8
        with:
          name: release-manifests
          path: .
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      - name: Ensure npm supports trusted publishing
        run: npm install --global npm@11
      - uses: actions/download-artifact@v8
        with:
          name: package-${{ matrix.pkg }}
          path: ${{ runner.temp }}/package
      - name: Resolve package metadata
        id: meta
        working-directory: packages/${{ matrix.pkg }}
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-beta.*) echo "dist_tag=beta" >> "$GITHUB_OUTPUT" ;;
            *-*) echo "::error::Unsupported prerelease version: $version"; exit 1 ;;
            *) echo "dist_tag=latest" >> "$GITHUB_OUTPUT" ;;
          esac
          if [[ "v$version" != "$RELEASE_TAG" ]]; then
            echo "::error::package version does not match $RELEASE_TAG"
            exit 1
          fi
      - name: Skip if already published
        id: published
        env:
          PACKAGE_NAME: ${{ steps.meta.outputs.name }}
          PACKAGE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Wait for the @brickkit packages it depends on
        if: steps.published.outputs.skip != 'true'
        working-directory: packages/${{ matrix.pkg }}
        env:
          PACKAGE_VERSION: ${{ steps.meta.outputs.version }}
        # The matrix publishes in parallel: bullmq-world pins redis-world and cli
        # needs core, so never publish one before the version it depends on.
        run: |
          for dep in $(node -p "Object.keys(require('./package.json').dependencies ?? {}).filter((name) => name.startsWith('@brickkit/')).join(' ')"); do
            for _ in $(seq 60); do
              npm view "$dep@$PACKAGE_VERSION" version >/dev/null 2>&1 && continue 2
              sleep 10
            done
            echo "::error::$dep@$PACKAGE_VERSION is not on npm; publish it first"
            exit 1
          done
      - name: Publish the validated tarball
        if: steps.published.outputs.skip != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_DIST_TAG: ${{ steps.meta.outputs.dist_tag }}
        run: npm publish "$RUNNER_TEMP/package/"*.tgz --provenance --access public --tag "$NPM_DIST_TAG"

  commit:
    needs: [prepare, validate, publish]
    if: github.event_name != 'pull_request' && inputs.dry_run != true
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.target.outputs.sha }}
      tag: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: release-manifests
          path: .
      - name: Commit and tag only after all packages were published
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/core/package.json packages/crud/package.json packages/cli/package.json packages/bullmq-world/package.json packages/redis-world/package.json bun.lock sdk/rust/brick/Cargo.toml sdk/rust/Cargo.lock examples/pages/services/bench-rust/Cargo.lock
          git commit -m "chore(release): $RELEASE_TAG"
          git tag "$RELEASE_TAG"
          for _ in 1 2 3; do
            git fetch origin "$RELEASE_BRANCH"
            git merge --no-edit FETCH_HEAD
            if git push --atomic origin "HEAD:refs/heads/$RELEASE_BRANCH" "$RELEASE_TAG"; then
              exit 0
            fi
          done
          echo "::error::The release branch kept advancing; retry this job."
          exit 1
      - name: Resolve validated release commit
        id: target
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: echo "sha=$(git rev-parse "$RELEASE_TAG^{commit}")" >> "$GITHUB_OUTPUT"

  # The Go and Rust SDKs, after npm and the release commit: the crate is
  # published from that commit, and the Go module is tagged sdk/go/v<version> on it.
  publish-sdks:
    needs: [prepare, publish, commit]
    if: github.event_name != 'pull_request' && inputs.dry_run != true
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Require the crates.io token
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [[ -z "$CARGO_REGISTRY_TOKEN" ]]; then
            echo "::error::The CARGO_REGISTRY_TOKEN secret is not set: add a crates.io token that can publish the brickkit crate (see CONTRIBUTING.md)"
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.commit.outputs.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Publish the brickkit crate
        working-directory: sdk/rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          version="${RELEASE_TAG#v}"
          crate="$(sed -n 's/^version = "\(.*\)"$/\1/p' brick/Cargo.toml | head -n 1)"
          if [[ "$crate" != "$version" ]]; then
            echo "::error::sdk/rust/brick/Cargo.toml has version $crate, not $version"
            exit 1
          fi
          if curl -sf -A "get-brickkit/brick release" "https://crates.io/api/v1/crates/brickkit/$version" >/dev/null; then
            echo "brickkit $version is already on crates.io"
          else
            cargo publish -p brickkit --locked
          fi
      - name: Tag the Go module
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.commit.outputs.sha }}
        run: |
          go_tag="sdk/go/$RELEASE_TAG"
          if git ls-remote --exit-code origin "refs/tags/$go_tag" >/dev/null; then
            echo "$go_tag already exists"
            exit 0
          fi
          git tag "$go_tag" "$RELEASE_SHA"
          git push origin "refs/tags/$go_tag"

  release:
    needs: [commit, publish]
    if: inputs.dry_run != true
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.commit.outputs.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Create combined GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.commit.outputs.tag }}
          RELEASE_SHA: ${{ needs.commit.outputs.sha }}
        run: |
          tag="$RELEASE_TAG"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            bun scripts/release-notes.ts > /tmp/brick-release-notes.md
            flags=(--latest)
            if [[ "$tag" == *-beta.* ]]; then flags=(--prerelease --latest=false); fi
            gh release create "$tag" --target "$RELEASE_SHA" \
              --title "$tag" --notes-file /tmp/brick-release-notes.md "${flags[@]}"
          fi
