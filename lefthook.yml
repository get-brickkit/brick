glob_matcher: doublestar

# Not parallel: check and check:www both build the packages and would race.
pre-commit:
  commands:
    whitespace:
      run: git diff --cached --check
    packages:
      # Git sets GIT_DIR etc. inside hooks, which breaks the nested git calls in scripts/*.test.ts.
      run: unset $(git rev-parse --local-env-vars) && bun run check
    website:
      glob:
        - "www/**"
        - "package.json"
        - "bun.lock"
        - ".oxlintrc.json"
        - ".oxfmtrc.json"
        - "lefthook.yml"
      run: bun run check:www
