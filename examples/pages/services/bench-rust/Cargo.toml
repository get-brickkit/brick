[package]
name = "bench-rust"
version = "0.0.0"
edition = "2024"
publish = false

# Its own workspace: not part of sdk/rust.
[workspace]

[dependencies]
brickkit = { path = "../../../../sdk/rust/brick" }
schemars = { version = "1.2.3", features = ["preserve_order"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "postgres",
  "derive",
] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }

[profile.release]
codegen-units = 1
lto = "thin"
